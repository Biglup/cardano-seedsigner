name: Update download table

# Not `release: published`: GITHUB_TOKEN-created releases emit no events, so
# that trigger never fires; workflow_run on the Release workflow does.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: update-download-table
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: regenerate the download table
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/${REPO}/releases/download/${TAG}"

          row() {
            local label="$1" board="$2"
            local file="cardano_seedsigner_os.${TAG}.${board}.img"
            echo "| ${label} | [${file}](${base}/${file}) | [.asc](${base}/${file}.asc) |"
          }

          {
            echo "<!-- BEGIN DOWNLOAD TABLE -->"
            echo "Latest release: **[${TAG}](https://github.com/${REPO}/releases/tag/${TAG})**"
            echo
            echo "| Board | Image | Signature |"
            echo "|-------|-------|-----------|"
            row "Raspberry Pi Zero 1.3" pi0
            row "Raspberry Pi Zero W" pi0
            row "Raspberry Pi Zero 2 W" pi02w
            row "Raspberry Pi 1 Model B/B+ (*)" pi0
            row "Raspberry Pi 2 Model B" pi2
            row "Raspberry Pi 3 Model B/B+" pi02w
            row "Raspberry Pi 4 Model B" pi4
            echo "| Checksums (all images) | [SHA256SUMS](${base}/SHA256SUMS) | [SHA256SUMS.asc](${base}/SHA256SUMS.asc) |"
            echo
            echo "(*) The Pi 1 needs a hardware modification to the Waveshare LCD HAT, see the [upstream legacy hardware notes](https://github.com/SeedSigner/seedsigner/blob/dev/docs/legacy_hardware.md)."
            echo "<!-- END DOWNLOAD TABLE -->"
          } > table.md

          python3 - <<'PY'
          import pathlib, re
          readme = pathlib.Path("README.md")
          block = pathlib.Path("table.md").read_text().rstrip("\n")
          text = readme.read_text()
          new = re.sub(
              r"<!-- BEGIN DOWNLOAD TABLE -->.*?<!-- END DOWNLOAD TABLE -->",
              lambda _: block,
              text,
              flags=re.S,
          )
          readme.write_text(new)
          PY

          rm table.md

      - name: commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update download table for ${{ github.event.release.tag_name }} [skip ci]"
          git push origin main
